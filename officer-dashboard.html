<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Department Dashboard | MUST Graduation Clearance</title>
    <link rel="stylesheet" href="style.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/officer-dashboard.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="navbar">
            <div class="brand-lockup">
                <img class="brand-logo" src="/ham.png" alt="Mbarara University of Science and Technology crest" width="80" height="80">
                <div class="brand-copy">
                    <p class="eyebrow">Mbarara University of Science and Technology</p>
                    <p class="brand-motto"><em>succeed we must</em></p>
                    <h1 id="roleTitle">Department dashboard</h1>
                </div>
            </div>
            <button class="danger" id="logoutButton" type="button">Sign out</button>
        </header>

        <p id="dashboardError" class="error-message" role="alert" hidden></p>

        <section class="card">
            <h2>Requests awaiting your review</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Request</th>
                            <th>Student</th>
                            <th>Current department</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestTableBody">
                        <tr><td colspan="5">Loading pending requests...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
