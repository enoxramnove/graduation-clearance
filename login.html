<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | MUST Graduation Clearance</title>
    <link rel="stylesheet" href="style.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/login.js" defer></script>
</head>
<body>
    <main class="container login-container">
        <header class="login-brand">
            <img class="brand-logo" src="/ham.png" alt="Mbarara University of Science and Technology crest" width="112" height="112">
            <p class="eyebrow">Mbarara University of Science and Technology</p>
            <p class="brand-motto"><em>succeed we must</em></p>
            <h1>Graduation Clearance</h1>
        </header>
        <p class="muted">Sign in with your university account.</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username / Registration number</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                       placeholder="e.g. @guild.must or 22/BIT/001/PS">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit">Sign in</button>
            <p id="errorMsg" class="error-message" role="alert" hidden></p>
        </form>
    </main>
</body>
</html>
