<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard | MUST Graduation Clearance</title>
    <link rel="stylesheet" href="style.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/student-dashboard.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="navbar">
            <div class="brand-lockup">
                <img class="brand-logo" src="/ham.png" alt="Mbarara University of Science and Technology crest" width="80" height="80">
                <div class="brand-copy">
                    <p class="eyebrow">Mbarara University of Science and Technology</p>
                    <p class="brand-motto"><em>succeed we must</em></p>
                    <h1>Student dashboard</h1>
                </div>
            </div>
            <button class="danger" id="logoutButton" type="button">Sign out</button>
        </header>

        <p id="dashboardError" class="error-message" role="alert" hidden></p>

        <section class="card" aria-labelledby="statusHeading">
            <h2 id="statusHeading">My clearance progress</h2>
            <p id="statusInfo" aria-live="polite">Loading clearance status...</p>
            <div id="actionButtonContainer" class="button-row"></div>
            <p id="rejectionReason" class="rejection-reason" hidden></p>
            <ol id="historyList" class="workflow-list" aria-label="Clearance stages"></ol>
        </section>

        <section class="card" aria-labelledby="notificationsHeading">
            <h2 id="notificationsHeading">Notifications</h2>
            <ul id="notificationList" class="message-list" aria-live="polite">
                <li>Loading notifications...</li>
            </ul>
        </section>
    </main>
</body>
</html>
